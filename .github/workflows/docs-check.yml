name: Documentation Check

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Links, blueprint contracts, and manifest coverage
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Validate documentation
        run: python scripts/check_docs.py
