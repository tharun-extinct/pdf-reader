name: Android Macrobenchmark

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

concurrency:
  group: android-macrobenchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macrobenchmark:
    name: API 34 emulator regression benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: temurin

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.7"

      - name: Enable KVM access
        run: sudo chmod 666 /dev/kvm

      - name: Run macrobenchmarks on managed emulator
        run: ./gradlew :macrobenchmark:pixel2Api34BenchmarkAndroidTest --stacktrace

      - name: Upload benchmark results and traces
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: macrobenchmark-api34
          path: |
            macrobenchmark/build/outputs/androidTest-results/**
            macrobenchmark/build/outputs/connected_android_test_additional_output/**
          if-no-files-found: warn
          retention-days: 14
